<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="chat.css"><title>Nero Agent</title></head><body>
<header><button id="historyButton" class="icon" title="Conversation history" aria-label="Conversation history">☰</button><div class="brand"><span class="mark">✳</span><strong>Nero</strong><span class="account">ChatGPT</span></div><div class="spacer"></div><button id="new" title="New conversation">＋ New chat</button><button id="open" class="icon" aria-label="Open larger chat window" title="Open larger chat window">↗</button><button id="settings" class="icon" aria-label="Agent settings" title="Agent settings">⚙</button></header>
<aside id="history" hidden><div class="drawerTitle">Your conversations<button id="closeHistory" class="icon" aria-label="Close history">×</button></div><p id="retention"></p><div id="conversations"></div></aside>
<main id="timeline" aria-label="Conversation"><div id="empty"><div class="halo">✳</div><h1>A little help, right here.</h1><p>Ask a question, work through an idea,<br>or check what’s happening in your Nook.</p><div class="suggestions"><button data-prompt="What can you help me with?">What can you do?</button><button data-prompt="What is happening in my Nook right now?" data-context="true">Check my Nook</button><button data-prompt="Help me plan an automation for my workspace." data-context="true">Plan an automation</button></div></div><div id="messages"></div></main>
<section id="proposal" hidden><div><strong>Suggested action</strong><span>Review before anything changes</span></div><pre></pre><button id="review">Review action…</button></section>
<footer><div class="contextRow"><label class="contextChip"><input id="useContext" type="checkbox">Use Nook context</label><span id="contextHint">Only your message and conversation</span><button id="retry" class="quiet" hidden>Retry last</button></div><div class="compose"><textarea id="draft" rows="2" maxlength="2048" placeholder="Message Nero…" aria-label="Message Nero"></textarea><button id="send" aria-label="Send message" title="Send · Enter">↑</button><button id="stop" aria-label="Stop reply" title="Stop reply" hidden>■</button></div><div class="bottom"><span id="status" role="status">Connecting…</span><span>Enter to send · Shift Enter for a new line</span></div><div id="error" role="alert" hidden></div></footer><script src="chat.js"></script></body></html>
