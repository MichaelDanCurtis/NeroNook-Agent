<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="awareness.css"><title>Nero activity</title></head><body>
<header><div><span class="eyebrow">NERO · CONTINUAL</span><h1>A little ahead of you.</h1></div><span id="phase" class="pill">Ready</span><div class="spacer"></div><button id="sources">Nero can see…</button><button id="pause">Pause</button></header>
<div class="toolbar"><span id="status" role="status">Choose your sources to begin.</span><div class="spacer"></div><button id="quiet" class="quiet">Quiet mode</button><button id="refresh" class="quiet">↻ Refresh</button></div>
<main><section class="left"><div class="sectionTitle"><h2>Ongoing work</h2><span id="watchCount"></span></div><div id="watches" class="cards"></div><div id="watchPager" class="pager"></div>
<section id="runDetails"><button id="runToggle" class="quiet" aria-expanded="false">▸ Watch an automation run</button><div id="runBody" hidden><p class="muted">Follow one exact run. This does not start an automation.</p><div id="runs"></div><div id="runPager" class="pager"></div><button id="nook">Enable Nook activity</button></div></section></section>
<section class="right"><div class="sectionTitle"><h2>What changed</h2><button id="acknowledge" class="quiet">Mark seen</button></div><div id="activities" class="timeline"></div><div id="activityPager" class="pager"></div></section></main>
<footer><div id="sourceSummary">No sources selected</div><button id="clear" class="quiet">Clear context</button></footer><div id="error" role="alert" hidden></div><script src="awareness.js"></script></body></html>
